    <div id="content"></div>

    <script>
        function loadPage(pagePath) {
            fetch(pagePath)
                .then((response) => response.text())
                .then((html) => {
                    document.getElementById("content").innerHTML = html;
                });
        }

        loadPage("src/html/index.html");
    </script>
